# This computer's settings. Copy this file to local.toml and fill it in.
# local.toml is not committed, since ports and camera numbers differ
# between computers.

# Find these with: python run.py find-port
#   Linux:   "/dev/ttyACM0"
#   macOS:   "/dev/tty.usbmodem585A0076841"
#   Windows: "COM3"
follower_port = "/dev/ttyACM0"
leader_port = "/dev/ttyACM1"

# One table per camera in config.toml. Find the numbers with:
#   python run.py find-cameras
[cameras.front]
index_or_path = 0

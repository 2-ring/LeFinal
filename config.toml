# Settings the whole group shares. Commit changes so everyone records,
# trains and evaluates the same way. This computer's USB ports and camera
# numbers go in local.toml instead.

[arms]
# Names for the two physical arms. Each one's calibration is saved as
# calibration/.../<id>.json, so keep these the same once you've calibrated.
follower_id = "follower"
leader_id = "leader"

[hub]
# Hugging Face user or organization that holds the group's datasets and
# models. A free organization lets everyone upload to the same place.
# Left empty, it uses whoever is logged in with `hf auth login`.
namespace = ""

# One table per camera, named for where it's mounted. Every computer must
# have the same cameras for datasets to be combinable. Which camera number
# each one is on a given computer goes in local.toml.
[cameras.front]
width = 640
height = 480

# [cameras.wrist]
# width = 640
# height = 480

[record]
name = "so101_pickplace"  # LeRobot adds the date and time to each session's dataset
task = "Pick up the cube and place it in the bin"
fps = 30  # cameras run at this rate too
num_episodes = 50
episode_time_s = 30
reset_time_s = 15

[train]
# The dataset to train on: one session's full name, or a merged one
# (see `python run.py merge`).
dataset = ""
policy = "act"  # or "smolvla"
steps = 100000
batch_size = 8
wandb = false  # true logs training curves to Weights & Biases (run `wandb login` first)

[eval]
num_episodes = 10
episode_time_s = 30
reset_time_s = 15
